name: Chromebook Web Build

on:
  workflow_dispatch:
  push:
    branches:
      - chromebook-offline
    paths:
      - 'Oxygen/**'
      - 'framework/**'
      - 'librmx/**'
      - '.github/workflows/chromebook-web.yml'

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23
          actions-cache-folder: 'emsdk-cache'

      - name: Configure WebAssembly build
        working-directory: Oxygen/sonic3air/build/_emscripten
        run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile Sonic 3 A.I.R. WebAssembly
        working-directory: Oxygen/sonic3air/build/_emscripten
        run: cmake --build build --parallel 2

      - name: Package game files for the single-file build
        working-directory: Oxygen/sonic3air
        run: |
          python3 "$EMSDK/upstream/emscripten/tools/file_packager.py" build/_emscripten/dist/sonic3air.data \
            --js-output=build/_emscripten/dist/loader.js \
            --preload ___internal@/sonic3air/___internal \
                      config.json@/sonic3air/config.json \
                      data@/sonic3air/data \
                      oxygenproject.json@/sonic3air/oxygenproject.json \
                      scripts@/sonic3air/scripts

      - name: Assemble standalone offline HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          dist = Path("Oxygen/sonic3air/build/_emscripten/dist")
          html = (dist / "sonic3air_web.html").read_text()
          loader = (dist / "loader.js").read_text()
          main_js = (dist / "sonic3air_web.js").read_text()
          package = base64.b64encode((dist / "sonic3air.data").read_bytes()).decode("ascii")

          # The game-data loader normally fetches sonic3air.data. Supply it directly
          # from this HTML file instead, which also works from a file:// URL.
          old_loader = """\t//Load the loader after the rest of the stuff, because otherwise we get a console error?
          \tvar loader=document.createElement('script');
          \tloader.setAttribute('async', '');
          \tloader.setAttribute('src', 'loader.js');
          \tdocument.body.appendChild(loader);
          \tModule['calledRun'] = true; //We got here from pre-run, so loader needs to know that."""
          new_loader = """\t// The preload loader is already embedded above the main engine script.
          \tModule['calledRun'] = true; //We got here from pre-run, so loader needs to know that."""
          if old_loader not in html:
              raise SystemExit("Could not find upstream dynamic loader block")
          html = html.replace(old_loader, new_loader)

          # Remove web-only links and service-worker registration.
          html = html.replace('<link rel="manifest" href="manifest.json">', '')
          html = html.replace('<link rel="apple-touch-icon" sizes="256x256" href="icon.png">', '')

          marker = '<script async src=sonic3air_web.js></script>'
          if marker not in html:
              raise SystemExit("Could not find the main engine script tag")

          embedded = (
              '<script>\n'
              'Module["getPreloadedPackage"] = function(name, size) {\n'
              '  var binary = atob("' + package + '");\n'
              '  var bytes = new Uint8Array(binary.length);\n'
              '  for (var i = 0; i < binary.length; ++i) bytes[i] = binary.charCodeAt(i);\n'
              '  return bytes.buffer;\n'
              '};\n'
              '</script>\n'
              '<script>\n' + loader + '\n</script>\n'
              '<script>\n' + main_js.replace('</script', '<\\/script') + '\n</script>'
          )
          html = html.replace(marker, embedded)
          output = Path("dist")
          output.mkdir(exist_ok=True)
          (output / "Sonic 3 A.I.R. Offline.html").write_text(html)
          PY

      - name: Upload standalone offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: sonic3air-single-file-offline
          path: dist/Sonic 3 A.I.R. Offline.html
          if-no-files-found: error
